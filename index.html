<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Level IoT Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#0f172a;
color:white;
text-align:center;
}

header{
background:#1e293b;
padding:20px;
font-size:28px;
font-weight:bold;
}

.container{
padding:30px;
}

.dashboard{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:40px;
margin-top:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
width:250px;
box-shadow:0 0 10px rgba(0,0,0,0.4);
}

h2{
margin-top:0;
}

.tank{
width:120px;
height:250px;
border:4px solid white;
margin:auto;
position:relative;
border-radius:10px;
overflow:hidden;
}

.water{
position:absolute;
bottom:0;
width:100%;
height:0%;
background:#38bdf8;
transition:0.5s;
}

button{

padding:10px 20px;
margin:5px;
font-size:16px;
border:none;
border-radius:6px;
cursor:pointer;
}

.on{
background:#22c55e;
color:white;
}

.off{
background:#ef4444;
color:white;
}

.mode{
background:#3b82f6;
color:white;
}

.status{
font-size:20px;
margin-top:10px;
}

footer{
margin-top:40px;
font-size:14px;
opacity:0.7;
}

</style>

</head>

<body>

<header>
Water Level Automation IoT Dashboard
</header>

<div class="container">

<div class="dashboard">

<div class="card">

<h2>Tank Level</h2>

<div class="tank">
<div class="water" id="water"></div>
</div>

<div class="status" id="levelText">
Loading...
</div>

</div>


<div class="card">

<h2>Distance</h2>

<div class="status" id="distance">
Loading...
</div>

</div>


<div class="card">

<h2>Motor Control</h2>

<div class="status" id="motorStatus">
Loading...
</div>

<button class="on" onclick="motorOn()">Motor ON</button>
<button class="off" onclick="motorOff()">Motor OFF</button>

</div>


<div class="card">

<h2>Mode</h2>

<div class="status" id="modeStatus">
Loading...
</div>

<button class="mode" onclick="autoMode()">AUTO</button>
<button class="mode" onclick="manualMode()">MANUAL</button>

</div>


<div class="card">

<h2>Buzzer</h2>

<button class="on" onclick="buzzerOn()">Enable</button>
<button class="off" onclick="buzzerOff()">Disable</button>

</div>

</div>

<footer>

NodeMCU ESP8266 • Ultrasonic Sensor • Blynk IoT

</footer>

</div>


<script>

const token = "D6Tv6Ahab06gdjkV0Pq9Kpu8D7Fum9Nv"


function getLevel(){

fetch(`https://blynk.cloud/external/api/get?token=${token}&v1`)
.then(res=>res.text())
.then(level=>{

document.getElementById("levelText").innerText =
level + " %"

document.getElementById("water").style.height =
level + "%"

})

}


function getDistance(){

fetch(`https://blynk.cloud/external/api/get?token=${token}&v2`)
.then(res=>res.text())
.then(d=>{

document.getElementById("distance").innerText =
d + " cm"

})

}


function getMotor(){

fetch(`https://blynk.cloud/external/api/get?token=${token}&v4`)
.then(res=>res.text())
.then(v=>{

if(v==1){

document.getElementById("motorStatus").innerText="ON"

}

else{

document.getElementById("motorStatus").innerText="OFF"

}

})

}


function getMode(){

fetch(`https://blynk.cloud/external/api/get?token=${token}&v3`)
.then(res=>res.text())
.then(v=>{

if(v==1){

document.getElementById("modeStatus").innerText="AUTO"

}

else{

document.getElementById("modeStatus").innerText="MANUAL"

}

})

}



function motorOn(){

fetch(`https://blynk.cloud/external/api/update?token=${token}&v4=1`)

}

function motorOff(){

fetch(`https://blynk.cloud/external/api/update?token=${token}&v4=0`)

}


function autoMode(){

fetch(`https://blynk.cloud/external/api/update?token=${token}&v3=1`)

}


function manualMode(){

fetch(`https://blynk.cloud/external/api/update?token=${token}&v3=0`)

}


function buzzerOn(){

fetch(`https://blynk.cloud/external/api/update?token=${token}&v5=1`)

}


function buzzerOff(){

fetch(`https://blynk.cloud/external/api/update?token=${token}&v5=0`)

}



function refresh(){

getLevel()
getDistance()
getMotor()
getMode()

}

setInterval(refresh,3000)

refresh()

</script>

</body>

</html>
```
